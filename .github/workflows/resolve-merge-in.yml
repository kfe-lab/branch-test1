# sync/* 브랜치 push 감지 → 충돌 마커 확인 → App 토큰으로 자동 merge commit
#
# 개발자가 sync/main-to-<branch> 에서 충돌을 해소하고 push하면 이 워크플로가:
# 1. 충돌 마커 잔존 여부를 검사합니다 (required check — 마커 있으면 차단).
# 2. 마커가 없으면 App 토큰으로 해당 PR을 merge commit으로 머지합니다.
#    (release/* squash-only 룰셋을 bypass)
#
# ── 사전 조건 ────────────────────────────────────────────────────────────
# auto-merge-in.yml과 동일한 GitHub App 설정을 사용합니다.
# App이 없으면 required check("conflict-check")만 동작하고,
# 자동 머지 스텝은 skip됩니다 (수동 머지 필요).

name: resolve-merge-in

on:
  push:
    branches:
      - "sync/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  conflict-check:
    name: conflict-check   # required status check 이름으로 등록하세요
    runs-on: ubuntu-latest
    outputs:
      has_conflicts: ${{ steps.check.outputs.has_conflicts }}
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 충돌 마커 검사
        id: check
        run: |
          # 충돌 마커(<<<<<<<, =======, >>>>>>>) 가 남아있는 파일 탐색
          CONFLICT_FILES=$(grep -rlE '^(<{7}|={7}|>{7})( |$)' . \
            --exclude-dir='.git' 2>/dev/null || true)

          if [ -n "$CONFLICT_FILES" ]; then
            echo "::error::충돌 마커가 남아 있는 파일:"
            echo "$CONFLICT_FILES" | while read -r f; do echo "::error::  $f"; done
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "✅ 충돌 마커 없음."
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: PR 번호 조회
        id: find-pr
        if: steps.check.outputs.has_conflicts == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_BRANCH: ${{ github.ref_name }}
        run: |
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$SYNC_BRANCH" \
            --state open \
            --limit 1 \
            --json number \
            | jq -r '.[0].number // ""')

          if [ -z "$PR_NUMBER" ]; then
            echo "::warning::open PR을 찾을 수 없습니다 (이미 머지됐거나 수동으로 닫혔을 수 있음)."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
          else
            echo "대상 PR: #$PR_NUMBER"
            echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          fi

  auto-merge:
    name: auto-merge
    needs: conflict-check
    if: |
      needs.conflict-check.outputs.has_conflicts == 'false' &&
      needs.conflict-check.outputs.pr_number != ''
    runs-on: ubuntu-latest
    steps:
      - name: App 토큰 발급 (squash-only bypass용)
        id: app-token
        if: vars.SYNC_APP_ID != '' && secrets.SYNC_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: merge commit으로 PR 머지 (App bypass)
        env:
          # GH_TOKEN: App 토큰 우선, 없으면 기본 토큰 (App 없으면 경고 후 종료)
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          # APP_TOKEN: 설정 여부 확인용 (직접 스크립트에 인터폴레이션 금지)
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ needs.conflict-check.outputs.pr_number }}
        run: |
          # APP_TOKEN 설정 여부 확인 (env var 경유 — 직접 ${{ }} 인터폴레이션 아님)
          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::App 토큰이 없습니다. SYNC_APP_ID / SYNC_APP_PRIVATE_KEY를 설정하면 자동 머지가 활성화됩니다."
            echo "PR #$PR_NUMBER 를 수동으로 머지하세요 (merge commit 방식 사용)."
            exit 0
          fi

          # PR 번호 검증 (숫자만 허용)
          if ! printf '%s' "$PR_NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::PR 번호가 유효하지 않습니다: $PR_NUMBER"
            exit 1
          fi

          echo "App 토큰으로 PR #$PR_NUMBER 를 merge commit으로 머지합니다..."
          if gh pr merge "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --merge \
              --delete-branch; then
            echo "✅ PR #$PR_NUMBER merge commit 머지 완료."
          else
            echo "::warning::자동 머지 실패. required check가 아직 통과되지 않았을 수 있습니다."
            echo "잠시 후 재시도하거나, PR을 직접 확인하세요."
          fi
