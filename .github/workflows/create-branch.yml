# 실수 5 대응 — 잘못된 브랜치 베이스 방지
#
# release/* / hotfix/* 브랜치를 항상 origin/main HEAD 기준으로 생성합니다.
# 로컬에서 git checkout -b 하면 "어느 브랜치에 있었느냐"에 따라 베이스가
# 달라지는 문제를 없앱니다. 브랜치 생성 경로를 이 워크플로 하나로 통일하세요.
#
# ── 브랜치명 규칙 ────────────────────────────────────────────────────────
# (release|hotfix)/YYYY.MM.DD.NN  (N = 0-9 두 자리)
# 예: release/2026.07.07.01  hotfix/2026.07.01.02
#
# ── 사전 조건 (1회성 설정) ──────────────────────────────────────────────
# 1. org 소유 GitHub App 생성 (Contents/PRs/Workflows: R&W)
# 2. release/**, hotfix/** 룰셋 Bypass list에 App 추가 (모드: Always)
# 3. App ID → repo variable: SYNC_APP_ID
# 4. App private key (.pem 전체) → repo secret: SYNC_APP_PRIVATE_KEY
#
# App이 없으면 GITHUB_TOKEN으로 push를 시도합니다.
# release/* 에 PR-required 룰이 있으면 이 경우 push가 실패할 수 있습니다.

name: create-branch

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '생성할 브랜치명 (예: release/2026.07.07.01, hotfix/2026.07.01.02)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치명 검증 (injection 방지 + 네이밍 규칙)
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          # 허용 문자 검사 (injection 방지)
          if ! printf '%s' "$BRANCH" | grep -qE '^[a-zA-Z0-9/_.-]+$'; then
            echo "::error::유효하지 않은 브랜치명입니다: 영문자·숫자·/ _ - . 만 허용됩니다."
            exit 1
          fi

          # 네이밍 규칙: (release|hotfix)/YYYY.MM.DD.NN
          if ! printf '%s' "$BRANCH" | grep -qE '^(release|hotfix)/[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::브랜치명이 규칙에 맞지 않습니다: (release|hotfix)/YYYY.MM.DD.NN 형식이어야 합니다."
            echo "::error::입력값: $BRANCH"
            exit 1
          fi

          echo "브랜치명 검증 통과: $BRANCH"

      - name: App 토큰 발급 (release/* bypass용)
        id: app-token
        if: vars.SYNC_APP_ID != '' && secrets.SYNC_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 중복 확인 + origin/main 기준 브랜치 생성
        env:
          BRANCH: ${{ inputs.branch }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTOR: ${{ github.actor }}
        run: |
          git fetch --all --quiet

          # 이미 존재하면 실패 (멱등 보호)
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "::error::이미 존재하는 브랜치입니다: $BRANCH"
            exit 1
          fi

          # 항상 origin/main HEAD 기준으로 새 ref 생성
          MAIN_SHA=$(git rev-parse origin/main)
          echo "$ACTOR 가 요청한 브랜치를 origin/main ($MAIN_SHA) 기준으로 생성합니다: $BRANCH"

          # push — App 토큰이 있으면 bypass 경로, 없으면 기본 토큰
          if [ -n "$APP_TOKEN" ]; then
            PUSH_URL="https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            echo "::warning::App 토큰이 없습니다. GITHUB_TOKEN으로 push합니다 (release/* 룰셋이 있으면 실패할 수 있음)."
            PUSH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          if git push "$PUSH_URL" "${MAIN_SHA}:refs/heads/${BRANCH}"; then
            echo "✅ 브랜치 생성됨: $BRANCH (base: $MAIN_SHA)"
          else
            echo "::error::브랜치 생성에 실패했습니다. App 설정(bypass)을 확인하세요."
            exit 1
          fi

      - name: Slack 알림 — 브랜치 생성 완료
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BRANCH: ${{ inputs.branch }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD=$(jq -n \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            '{text: "🌿 *브랜치 생성됨*\n브랜치: `\($branch)` (origin/main 기준)\n생성 요청자: \($actor)\n<\($url)|Actions 로그>"}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
