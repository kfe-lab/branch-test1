# release→main PR 열기 전 동기화 확인
#
# release/* 또는 hotfix/* 브랜치가 main으로 PR을 열 때,
# main이 전진한 이후 merge-in(main→release)이 완료됐는지 검증합니다.
#
# ── merge commit 기반 ancestry 검증 ─────────────────────────────────────
# auto-merge-in.yml이 merge commit을 사용하므로, main의 커밋이
# release/* 의 직접 조상(ancestor)으로 남습니다.
# git merge-base --is-ancestor 한 줄로 명확하게 검증합니다.
# (이전 squash 방식의 취약한 "PR 제목 SHA 파싱" 로직 제거)

name: verify-sync

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  pull-requests: read
  statuses: write

jobs:
  check:
    # release/* 또는 hotfix/* → main PR에만 적용
    if: |
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'hotfix/')
    runs-on: ubuntu-latest
    steps:
      - name: 브랜치명 검증 (injection 방지)
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if ! printf '%s' "$HEAD_BRANCH" | grep -qE '^[a-zA-Z0-9/_-]+$'; then
            echo "::error::Invalid branch name: contains disallowed characters"
            exit 1
          fi
          echo "Branch name validated: $HEAD_BRANCH"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: main과의 분기 이후 커밋 수 확인
        id: check_diverge
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch origin "$HEAD_BRANCH" "$BASE_BRANCH" --quiet
          MERGE_BASE=$(git merge-base "origin/$BASE_BRANCH" "origin/$HEAD_BRANCH")
          MAIN_AHEAD=$(git rev-list --count "$MERGE_BASE..origin/$BASE_BRANCH")
          echo "main_ahead=$MAIN_AHEAD" >> "$GITHUB_OUTPUT"
          echo "현재 main은 분기점 대비 $MAIN_AHEAD 커밋 앞서 있습니다."

      - name: merge-in 완료 여부 검증 (ancestry 확인)
        if: steps.check_diverge.outputs.main_ahead != '0'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "main이 분기점 이후 전진함 → merge-in 완료 여부를 확인합니다."

          if git merge-base --is-ancestor "origin/main" "origin/$HEAD_BRANCH"; then
            echo "✅ main이 $HEAD_BRANCH의 조상입니다. merge-in 완료."
          else
            echo "::error::main이 $HEAD_BRANCH에 merge-in되지 않았습니다."
            echo "::error::auto-merge-in 워크플로가 완료될 때까지 기다리거나,"
            echo "::error::충돌이 있는 경우 sync/* PR을 먼저 해소·머지하세요."
            exit 1
          fi

      - name: 동기화 불필요 (main이 전진하지 않음)
        if: steps.check_diverge.outputs.main_ahead == '0'
        run: echo "✅ main이 분기점 이후 전진하지 않았습니다. 동기화 불필요."
